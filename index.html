<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Team</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f5f7f6;--ink:#3b4743;--mute:#8a9692;--line:#e6ebe8;--acc:#7aa396;--soft:#e8f0ed;--on:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2220;--ink:#d3dcd8;--mute:#7f8d88;--line:#2a3330;--acc:#8fb8aa;--soft:#263430;--on:#17201d}}
:root[data-theme="dark"]{--bg:#1c2220;--ink:#d3dcd8;--mute:#7f8d88;--line:#2a3330;--acc:#8fb8aa;--soft:#263430;--on:#17201d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 20px 12px;z-index:2}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd b{font-weight:500;font-size:1.15rem}.hd span{color:var(--mute)}
.cur{color:var(--mute);font-size:.85rem;margin-top:2px;min-height:1.3em}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
main{max-width:520px;margin:0 auto;padding:4px 20px 96px}
.toast{display:none;background:var(--soft);border-radius:10px;padding:10px 14px;margin:6px 0 10px;font-size:.9rem}
.toast button{float:right;background:none;border:0;color:var(--mute);font:inherit;padding:0 0 0 12px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.pills button{flex:none;border:0;background:none;color:var(--mute);font:inherit;padding:8px 12px;border-radius:20px}
.pills button.on{background:var(--soft);color:var(--ink)}
.lv{color:var(--mute);font-size:.85rem;display:flex;justify-content:space-between}
.tag{color:var(--mute);font-size:.85rem;font-style:italic;margin:8px 0 0}
.r{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.r div{flex:1;min-width:0}.r small{display:block;color:var(--mute);font-size:.82rem}
.r.lock{opacity:.4}.r.on b{color:var(--acc)}
h3{font-weight:500;font-size:.95rem;margin:22px 0 2px;color:var(--mute)}
button.b{min-height:38px;padding:0 16px;border-radius:19px;border:0;background:var(--soft);color:var(--ink);font:inherit}
.r.on button.b,button.p{background:var(--acc);color:var(--on)}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{color:var(--mute);text-align:center;padding:36px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:52px;background:none;border:0;color:var(--mute);font:inherit}
nav button.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--acc)}
.rs{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:.8rem;padding:14px 0}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:0;border-radius:10px;padding:8px 10px;max-width:100%;margin:2px 0}
nav button{font-size:.88rem}
</style>
</head>
<body>
<header>
  <div class="hd"><b>La Team</b><span id="gold"></span></div>
  <div class="cur" id="cn"></div>
  <div class="bar"><i id="cb"></i></div>
</header>
<main>
  <div class="toast" id="toast"><button id="tok">OK</button><span id="tt"></span></div>
  <section id="p-act"><div class="pills" id="pills"></div><div class="lv"><span id="lv"></span><span id="sp"></span></div><div class="bar"><i id="xb"></i></div><p class="tag" id="tag"></p><div id="acts"></div></section>
  <section id="p-bag" hidden><div class="empty" id="bagE">Ton sac est vide.</div><div id="bag"></div></section>
  <section id="p-shop" hidden><h3>Outils</h3><div id="tools"></div><h3>Équipement de bagarre</h3><div id="eq"></div><h3>Comptoir</h3><div id="bar"></div><h3>Nouvelle saison</h3><div class="r"><div><b>Tout recommencer, en mieux</b><small id="rt"></small></div><button class="b p" id="rb"></button></div><button class="rs" id="rs">Effacer la partie</button></section>
  <section id="p-goal" hidden><div id="goals"></div></section>
  <section id="p-band" hidden>
    <p class="tag" id="bmsg">Connexion à la bande…</p>
    <div class="r"><div><b>Ton pseudo</b><small>Visible par toute la bande</small></div><input id="pseudo" maxlength="14" placeholder="Ton pseudo" style="width:130px"></div>
    <h3>Soirée de la bande (coop)</h3><div id="soiree"></div>
    <h3>Défi du jour : qui fait le plus d’actions</h3><div id="defi"></div>
    <h3>Classement général</h3><div id="clas"></div>
    <h3>Cadeaux entre potes</h3>
    <div class="r"><div><select id="gto"></select> <select id="git"></select> <input id="gq" type="number" min="1" value="1" style="width:64px"></div><button class="b p" id="gsend">Envoyer</button></div>
  </section>
</main>
<nav><button data-tab="act" class="on">Jouer</button><button data-tab="bag">Sac</button><button data-tab="shop">Atelier</button><button data-tab="goal">Quêtes</button><button data-tab="band">Bande</button></nav>
<script>
var KEY='lateam-v1',CAP=8*3600,cur='bois';
var SK=[
['bois','Bricolage','Nanard est aux commandes. Ça tient presque debout.'],
['mine','Recyclage','Poumes surveille : rien ne se perd, tout se trie.'],
['forge','Garage','Le garage de la bande. Coco devait passer, mais il gère la famille.'],
['peche','Pêche','Stalek n\'aime pas ça. Il vient quand même.'],
['cuisine','Barbecue','Riton au grill. Les extincteurs sont prêts.'],
['vigne','Vendanges','Paulo supervise. Interdit de dire « piquette » devant lui.'],
['combat','Bagarre','Ici, on règle ça à la militaire.']];
var IT={palette:['Palette',2],planche:['Planche de chêne',6],poutre:['Poutre de charpente',18],canette:['Canette',2],ferraille:['Ferraille',6],compo:['Composant rare',18],alu:['Lingot d\'alu',8],acier:['Lingot d\'acier',22],titane:['Lingot de titane',65],goujon:['Goujon',2],brochet:['Brochet',6],silure:['Silure',18],saucisse:['Saucisse grillée',5],bbq:['Brochet au barbecue',14],fume:['Silure fumé',40],raisin:['Raisin',3],piquette:['Piquette',14],cru:['Grand cru',60],or:['€',0]};
var A=[
['palette','bois','Palettes de récup',1,3,6,0,{palette:1}],['planche','bois','Planches de chêne',6,4,14,0,{planche:1}],['poutre','bois','Poutres de charpente',12,6,32,0,{poutre:1}],
['canette','mine','Tri des canettes',1,3,6,0,{canette:1}],['ferraille','mine','Fouille à la déchetterie',6,4,14,0,{ferraille:1}],['compo','mine','Démontage d\'électroménager',12,6,32,0,{compo:1}],
['alu','forge','Lingot d\'alu',1,4,8,{canette:2},{alu:1}],['acier','forge','Lingot d\'acier',6,5,20,{ferraille:2},{acier:1}],['titane','forge','Lingot de titane',12,7,45,{compo:2},{titane:1}],
['goujon','peche','Goujons du canal',1,3,6,0,{goujon:1}],['brochet','peche','Brochets de l\'étang',6,4,14,0,{brochet:1}],['silure','peche','Silure du lac',12,6,32,0,{silure:1}],
['saucisse','cuisine','Saucisses (un peu cramées)',1,3,8,{goujon:1},{saucisse:1}],['bbq','cuisine','Brochet au barbecue',6,4,18,{brochet:1},{bbq:1}],['fume','cuisine','Silure fumé',12,6,40,{silure:1},{fume:1}],
['raisin','vigne','Vendange du raisin',1,4,8,0,{raisin:1}],['piquette','vigne','Cuvée de piquette',6,6,22,{raisin:3},{piquette:1}],['cru','vigne','Grand cru de Paulo',12,9,55,{raisin:5},{cru:1}],
['videur','combat','Le videur du bar',1,5,12,{saucisse:1},{or:8}],['voisin','combat','Le voisin qui râle',6,6,34,{bbq:1},{or:28}],['costaud','combat','Le costaud du camping',12,8,90,{fume:1},{or:85}]
].map(function(a){return{id:a[0],sk:a[1],nom:a[2],lvl:a[3],sec:a[4],xp:a[5],inn:a[6]||{},out:a[7]}});
var AM={};A.forEach(function(a){AM[a.id]=a});
var Q=[
['Nanard','Une cabane à finir. Il lui faut 30 palettes.',{palette:30},60],
['Riton','Il a tout cramé. Ramène-lui 10 saucisses grillées.',{saucisse:10},90],
['Poumes','Pour son composteur : 40 canettes.',{canette:40},70],
['Stalek','Il veut pouvoir dire qu\'il a pêché. 8 goujons suffisent.',{goujon:8},60],
['Paulo','Pour la dégustation : 5 piquettes.',{piquette:5},120],
['Coco','Il viendra à la soirée si la famille le permet. Prépare 6 brochets au barbecue.',{bbq:6},180],
['Nanard','Une vraie charpente : 10 poutres.',{poutre:10},400],
['Toute la bande','La soirée parfaite : 3 grands crus et 5 silures fumés.',{cru:3,fume:5},1500],
['Coco','« Un bon apéro, ça se prépare. » 12 piquettes pour la soirée.',{piquette:12},300]];
function fresh(){var o={act:null,prog:0,t:Date.now(),xp:{},tool:{},inv:{or:0},eq:{batte:0,treillis:0},stars:0,done:{},n:0,buff:0,buffM:1,dayKey:'',dayN:0,pseudo:'',sdone:{},give:{}};SK.forEach(function(s){o.xp[s[0]]=0;o.tool[s[0]]=0});return o}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r),f=fresh();for(var k in f){if(d[k]!==undefined)f[k]=d[k]}return f}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var st=load();
var cocoEnd=Math.random()<0.4?Date.now()+600000:0;
var PO=['Woness','Gouness','Poumness','Compostesse','Recyclesse','Triness'],po=PO[Math.floor(Math.random()*PO.length)];
function lvl(sk){return Math.floor(Math.sqrt(st.xp[sk]/40))+1}
function sp(sk){return(1+0.04*(lvl(sk)-1))*(1+0.25*st.tool[sk])*(Date.now()<st.buff?st.buffM:1)}
function inv(k){return st.inv[k]||0}
function fmt(n){return Math.floor(n).toLocaleString('fr-FR')}
function has(o){for(var k in o){if(inv(k)<o[k])return false}return true}
function txt(o){var r=[];for(var k in o){r.push(o[k]+' '+IT[k][0].toLowerCase())}return r.join(', ')}
function sum(){var s=0;SK.forEach(function(k){s+=lvl(k[0])});return s}
function dn(){var k=new Date().toISOString().slice(0,10);if(st.dayKey!==k){st.dayKey=k;st.dayN=0}st.dayN++}
function advance(sec){
  while(sec>0&&st.act){
    var a=AM[st.act],d=a.sec/sp(a.sk),need=d-st.prog;
    if(sec<need){st.prog+=sec;return}
    sec-=need;st.prog=0;
    if(!has(a.inn)){st.act=null;st.msg='Activité arrêtée : il te manque '+txt(a.inn)+'.';return}
    for(var k in a.inn)st.inv[k]=inv(k)-a.inn[k];
    for(var k in a.out)st.inv[k]=inv(k)+a.out[k]*(k==='or'?1+0.3*st.eq.batte:1);
    st.xp[a.sk]+=a.xp*(1+0.1*st.stars)*(a.sk==='combat'?(1+0.3*st.eq.treillis)*(Date.now()<cocoEnd?1.3:1):1);st.n++;dn();
  }
}
function ecost(k){var n=st.eq[k];return{l:['alu','acier','titane'][n],q:(k==='batte'?[6,8,10]:[8,10,12])[n],g:[50,200,800][n]}}
function tcost(sk){return 40*Math.pow(3,st.tool[sk])}
function gain(){return Math.max(0,Math.floor(sum()/14)-2)}
var h='';SK.forEach(function(s){h+='<button data-sk="'+s[0]+'" id="pl-'+s[0]+'">'+s[1]+'</button>'});document.getElementById('pills').innerHTML=h;
h='';A.forEach(function(a){
  var d=a.sec+' s'+(Object.keys(a.inn).length?' · −'+txt(a.inn):'')+' · +'+txt(a.out);
  h+='<div class="r" id="a-'+a.id+'"><div><b>'+a.nom+'</b><small>'+d+'</small></div><button class="b" data-act="'+a.id+'" id="g-'+a.id+'"></button></div>'});
document.getElementById('acts').innerHTML=h;
h='';for(var k in IT){if(k!=='or')h+='<div class="r" id="i-'+k+'" hidden><div><b>'+IT[k][0]+'</b><small id="q-'+k+'"></small></div><button class="b" data-sell="'+k+'">Vendre</button></div>'}
document.getElementById('bag').innerHTML=h;
h='';SK.forEach(function(s){h+='<div class="r"><div><b>'+s[1]+'</b><small id="t-'+s[0]+'"></small></div><button class="b" data-up="'+s[0]+'" id="u-'+s[0]+'"></button></div>'});
document.getElementById('tools').innerHTML=h;
h='';[['batte','Batte de baseball','+30 % de € par bagarre'],['treillis','Treillis renforcé','+30 % d\'xp en bagarre']].forEach(function(e){
  h+='<div class="r"><div><b>'+e[1]+'</b><small id="e-'+e[0]+'"></small></div><button class="b" data-eq="'+e[0]+'" id="eb-'+e[0]+'"></button></div>'});
document.getElementById('eq').innerHTML=h;
var DR=[['pastis','Un pastis bien frais','+25 % de vitesse pendant 5 min',1.25,300000,{or:15}],['piquette','Trinquer à la piquette','+20 % de vitesse pendant 5 min',1.2,300000,{piquette:1}],['cru','Trinquer au grand cru','+40 % de vitesse pendant 10 min',1.4,600000,{cru:1}]];
h='';DR.forEach(function(b){h+='<div class="r"><div><b>'+b[1]+'</b><small>'+b[2]+' · −'+txt(b[5])+'</small></div><button class="b" data-drink="'+b[0]+'" id="d-'+b[0]+'">Trinquer</button></div>'});
document.getElementById('bar').innerHTML=h;
h='';Q.forEach(function(q,i){h+='<div class="r"><div><b>'+(q[0]==='Poumes'?'Poumes, alias '+po:q[0])+'</b><small>'+q[1]+' Récompense : '+q[3]+' €</small></div><button class="b" data-q="'+i+'" id="q'+i+'"></button></div>'});
document.getElementById('goals').innerHTML=h;
function render(){
  document.getElementById('gold').textContent=fmt(inv('or'))+' €'+(st.stars?' · '+st.stars+' ★':'');
  var a=st.act&&AM[st.act],d=a?a.sec/sp(a.sk):1;
  document.getElementById('cn').textContent=a?a.nom+' · '+d.toFixed(1).replace('.',',')+' s par action':'Choisis une activité pour commencer.';
  document.getElementById('cb').style.width=a?Math.min(100,st.prog/d*100)+'%':'0';
  var on2=Date.now()<st.buff;if(on2)document.getElementById('cn').textContent+=' · Apéro actif ('+Math.ceil((st.buff-Date.now())/60000)+' min)';
  DR.forEach(function(b){document.getElementById('d-'+b[0]).disabled=on2||!has(b[5])});
  var l=lvl(cur),lo=40*(l-1)*(l-1),hi=40*l*l;
  document.getElementById('lv').textContent='Niveau '+l;document.getElementById('sp').textContent='vitesse ×'+sp(cur).toFixed(2).replace('.',',');
  document.getElementById('xb').style.width=((st.xp[cur]-lo)/(hi-lo)*100)+'%';
  SK.forEach(function(s){var id=s[0];document.getElementById('pl-'+id).className=id===cur?'on':'';
    if(id===cur)document.getElementById('tag').textContent=s[2]+(id==='combat'?(Date.now()<cocoEnd?' Coco est là : +30 % d\'xp.':' Coco est avec sa famille.'):'')+(id==='mine'?' Aujourd\'hui, on l\'appelle '+po+'.':'');
    document.getElementById('t-'+id).textContent='Niveau '+st.tool[id]+(st.tool[id]>=8?' (max)':' · '+fmt(tcost(id))+' €');
    var u=document.getElementById('u-'+id);u.textContent=st.tool[id]>=8?'Max':'Améliorer';u.disabled=st.tool[id]>=8||inv('or')<tcost(id)});
  A.forEach(function(x){
    var on=st.act===x.id,lock=lvl(x.sk)<x.lvl,e=document.getElementById('a-'+x.id);
    e.hidden=x.sk!==cur;e.className='r'+(on?' on':'')+(lock?' lock':'');
    var g=document.getElementById('g-'+x.id);g.disabled=lock;g.textContent=lock?'Niv. '+x.lvl:(on?'Arrêter':'Lancer')});
  var n=0;for(var k in IT){if(k==='or')continue;var q=inv(k);document.getElementById('i-'+k).hidden=q<1;if(q>=1){n++;document.getElementById('q-'+k).textContent=fmt(q)+' · '+IT[k][1]+' € pièce'}}
  document.getElementById('bagE').style.display=n?'none':'block';
  ['batte','treillis'].forEach(function(k){var n=st.eq[k],b=document.getElementById('eb-'+k),t=document.getElementById('e-'+k);
    if(n>=3){t.textContent='Palier 3 (max)';b.textContent='Max';b.disabled=true;return}
    var c=ecost(k);t.textContent='Palier '+n+' · prochain : '+c.q+' '+IT[c.l][0].toLowerCase()+' + '+c.g+' €';
    b.textContent='Fabriquer';b.disabled=inv(c.l)<c.q||inv('or')<c.g});
  var gn=gain();document.getElementById('rt').textContent='Repars de zéro avec +10 % d\'xp par étoile. Gain actuel : '+gn+' ★ (niveaux totaux : '+sum()+')';
  document.getElementById('rb').textContent='Lancer';document.getElementById('rb').disabled=gn<1;
  Q.forEach(function(q,i){var b=document.getElementById('q'+i),ok=has(q[2]);b.textContent=st.done[i]?'Fait':'Livrer';b.disabled=!!st.done[i]||!ok;b.className='b'+(ok&&!st.done[i]?' p':'')});
}
var T=document.getElementById('toast');
function toast(m){document.getElementById('tt').textContent=m;T.style.display='block'}
var L0={};
function tick(){
  var now=Date.now(),dt=Math.min((now-st.t)/1000,CAP);st.t=now;
  if(dt>10&&st.act){
    var b={};for(var k in st.inv)b[k]=st.inv[k];advance(dt);
    var g=[];for(var k in st.inv){var d=(st.inv[k]||0)-(b[k]||0);if(d>=1)g.push('+'+fmt(d)+' '+IT[k][0].toLowerCase())}
    toast('Pendant ton absence ('+Math.round(dt/60)+' min) : '+(g.slice(0,4).join(', ')||'rien')+'.');
  }else advance(dt);
  SK.forEach(function(s){var l=lvl(s[0]);if(L0[s[0]]&&l>L0[s[0]])toast(s[1]+' : niveau '+l+' !');L0[s[0]]=l});
  if(st.msg){toast(st.msg);st.msg=null}
  render();
}
document.addEventListener('click',function(e){
  var D=e.target.dataset||{};
  if(D.sk){cur=D.sk}
  if(D.act){st.act=st.act===D.act?null:D.act;st.prog=0;st.t=Date.now()}
  if(D.sell){st.inv.or=inv('or')+inv(D.sell)*IT[D.sell][1];st.inv[D.sell]=0}
  if(D.up&&inv('or')>=tcost(D.up)&&st.tool[D.up]<8){st.inv.or-=tcost(D.up);st.tool[D.up]++}
  if(D.eq&&st.eq[D.eq]<3){var c=ecost(D.eq);if(inv(c.l)>=c.q&&inv('or')>=c.g){st.inv[c.l]-=c.q;st.inv.or-=c.g;st.eq[D.eq]++}}
  if(D.q!==undefined&&!st.done[D.q]&&has(Q[D.q][2])){var q=Q[D.q];for(var k in q[2])st.inv[k]-=q[2][k];st.inv.or=inv('or')+q[3];st.done[D.q]=1;toast(q[0]+' : « Merci ! » +'+q[3]+' €')}
  if(D.drink&&Date.now()>=st.buff){var dr=DR.filter(function(x){return x[0]===D.drink})[0];
    if(dr&&has(dr[5])){var co=Date.now()<cocoEnd;for(var k in dr[5])st.inv[k]-=dr[5][k];st.buff=Date.now()+dr[4]*(co?2:1);st.buffM=dr[3];
      toast(co?(D.drink==='pastis'?'Coco : « Un pastis, un vrai ! » Il boit comme quatre : l\'apéro dure deux fois plus longtemps.':'Coco boit comme quatre : l\'apéro dure deux fois plus longtemps !'):'Tchin ! Bonus actif.')}}
  if(D.tab){['act','bag','shop','goal','band'].forEach(function(p){document.getElementById('p-'+p).hidden=p!==D.tab});
    document.querySelectorAll('nav button').forEach(function(b){b.className=b.dataset.tab===D.tab?'on':''});window.scrollTo(0,0)}
  save();render();
});
document.getElementById('rb').onclick=function(){
  var gn=gain();if(gn<1)return;var o=fresh();o.stars=st.stars+gn;o.done=st.done;o.n=st.n;o.give=st.give;o.pseudo=st.pseudo;o.sdone=st.sdone;o.dayKey=st.dayKey;o.dayN=st.dayN;st=o;save();toast('Nouvelle saison ! Tu gagnes '+gn+' ★.');render()};
document.getElementById('tok').onclick=function(){T.style.display='none'};
var rt=null,rs=document.getElementById('rs');
rs.onclick=function(){
  if(rt){clearTimeout(rt);rt=null;st=fresh();save();rs.textContent='Effacer la partie';T.style.display='none';render();return}
  rs.textContent='Appuie encore pour tout effacer';rt=setTimeout(function(){rt=null;rs.textContent='Effacer la partie'},3000);
};
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
tick();setInterval(tick,250);setInterval(save,2000);
if(cocoEnd)toast('Coco a un créneau : renfort en Bagarre pendant 10 minutes (+30 % d\'xp) !');else toast('Coco est avec sa famille. Il t\'envoie un pouce levé.');
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,setDoc,collection,addDoc,deleteDoc,onSnapshot,query,where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg={
  apiKey:"AIzaSyDgyKg_Brf5CVGUajiCQTQglmxVGQGXM34",
  authDomain:"la-team-305ad.firebaseapp.com",
  databaseURL:"https://la-team-305ad-default-rtdb.firebaseio.com",
  projectId:"la-team-305ad",
  storageBucket:"la-team-305ad.firebasestorage.app",
  messagingSenderId:"72361489328",
  appId:"1:72361489328:web:79f66e792b1c53374a1c75"
};
let FS=null,ME=null,PL={},seen={},lastJ='',lastB='',sg={};
const SO={id:'S1',needs:{saucisse:100,piquette:50,cru:10},reward:500};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function txp(){var t=0;for(var k in st.xp)t+=st.xp[k];return Math.floor(t)}
function bmsg(m){document.getElementById('bmsg').textContent=m}
function sync(){
  if(!FS||!ME)return;
  var d={pseudo:(st.pseudo||'Joueur').slice(0,14),score:txp(),lv:sum(),stars:st.stars,dayKey:st.dayKey,dayN:st.dayN,give:st.give||{}},j=JSON.stringify(d);
  if(j===lastJ)return;lastJ=j;
  setDoc(doc(FS,'players',ME),d).catch(function(e){lastJ='';bmsg('Écriture impossible ('+(e&&e.code)+'). Vérifie les règles Firestore.')});
}
function totals(){var t={};Object.keys(PL).forEach(function(i){var g=PL[i].give||{};for(var k in SO.needs)t[k]=(t[k]||0)+(+g[k]||0)});return t}
function rw(l,r){return '<div class="r"><div><b>'+esc(l)+'</b></div><span style="color:var(--mute)">'+esc(r)+'</span></div>'}
function fillSel(id,opts){var el=document.getElementById(id),s=JSON.stringify(opts);if(sg[id]===s)return;sg[id]=s;var v=el.value;
  el.innerHTML=opts.map(function(o){return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>'}).join('');
  if(opts.some(function(o){return o[0]===v}))el.value=v}
function gsel(){var o=[];for(var k in IT){if(k!=='or'&&inv(k)>=1)o.push([k,IT[k][0]])}fillSel('git',o)}
function renderBand(){
  var ids=Object.keys(PL),t=totals(),ok=true,s='';
  for(var k in SO.needs){var n=SO.needs[k],v=Math.min(t[k]||0,n);if(v<n)ok=false;
    s+='<div class="r"><div><b>'+esc(IT[k][0])+'</b><small>'+fmt(t[k]||0)+' / '+n+'</small><div class="bar"><i style="width:'+(v/n*100)+'%"></i></div></div><button class="b" data-give="'+k+'">Donner 10</button></div>'}
  s+=st.sdone[SO.id]?'<div class="r"><div><b>Soirée réussie !</b><small>Récompense déjà récupérée.</small></div></div>':'<div class="r"><div><b>Récompense</b><small>'+SO.reward+' € + apéro offert 30 min</small></div><button class="b p" data-claim="1"'+(ok?'':' disabled')+'>Récupérer</button></div>';
  var me=function(i){return i===ME?' (toi)':''};
  var dj=ids.filter(function(i){return PL[i].dayKey===today()}).sort(function(a,b){return (PL[b].dayN||0)-(PL[a].dayN||0)});
  var dh=dj.length?dj.map(function(i,n){return rw((n+1)+'. '+PL[i].pseudo+me(i),fmt(PL[i].dayN||0)+' actions')}).join(''):'<div class="empty">Personne n’a encore joué aujourd’hui.</div>';
  var ch=ids.slice().sort(function(a,b){return (PL[b].score||0)-(PL[a].score||0)}).map(function(i,n){var p=PL[i];return rw((n+1)+'. '+p.pseudo+me(i),'niv. '+(p.lv||0)+(p.stars?' · '+p.stars+' ★':''))}).join('');
  var key=s+dh+ch;if(key!==lastB){lastB=key;document.getElementById('soiree').innerHTML=s;document.getElementById('defi').innerHTML=dh;document.getElementById('clas').innerHTML=ch}
  fillSel('gto',ids.filter(function(i){return i!==ME}).map(function(i){return [i,String(PL[i].pseudo||'Joueur')]}));gsel();
}
function gclaim(x){var g=x.data();if(!g||seen[x.id])return;seen[x.id]=1;
  var bad=!IT[g.item]||g.item==='or'||!(g.qty>=1)||g.qty>1000;
  deleteDoc(doc(FS,'gifts',x.id)).then(function(){
    if(bad)return;st.inv[g.item]=inv(g.item)+g.qty;save();render();
    toast(String(g.fromName||'Un pote')+' t’envoie '+g.qty+' '+IT[g.item][0].toLowerCase()+' !');
  }).catch(function(){seen[x.id]=0});
}
document.addEventListener('click',function(e){
  var D=e.target.dataset||{};
  if(D.give){
    if(!FS||!ME){toast('Pas connecté à la bande pour le moment.');return}
    var k=D.give,q=Math.min(10,Math.floor(inv(k)));
    if(q<1){toast('Tu n’as pas de '+IT[k][0].toLowerCase()+' à donner.');return}
    st.inv[k]-=q;st.give[k]=(st.give[k]||0)+q;if(PL[ME])PL[ME].give=st.give;save();sync();renderBand();render();
  }
  if(D.claim&&FS&&!st.sdone[SO.id]){
    var t=totals(),ok=true;for(var k2 in SO.needs){if((t[k2]||0)<SO.needs[k2])ok=false}
    if(ok){st.sdone[SO.id]=1;st.inv.or=inv('or')+SO.reward;st.buff=Date.now()+1800000;st.buffM=1.3;
      toast('La soirée est une réussite ! +'+SO.reward+' € et apéro offert pendant 30 minutes.');save();renderBand();render()}
  }
  if(e.target.id==='gsend'){
    var to=document.getElementById('gto').value,it=document.getElementById('git').value,n=Math.floor(+document.getElementById('gq').value);
    if(!FS||!ME||!to||!IT[it]||it==='or'||!(n>=1)||n>inv(it)){toast('Choisis un pote, un objet et une quantité que tu possèdes.');return}
    st.inv[it]-=n;save();render();
    addDoc(collection(FS,'gifts'),{from:ME,fromName:(st.pseudo||'Un pote').slice(0,14),to:to,item:it,qty:n,t:Date.now()})
      .then(function(){toast('Cadeau envoyé !')})
      .catch(function(){st.inv[it]=inv(it)+n;save();render();toast('Envoi impossible, objets rendus.')});
  }
});
var pi=document.getElementById('pseudo');pi.value=st.pseudo||'';
pi.onchange=function(){st.pseudo=pi.value.trim().slice(0,14);save();sync()};
document.addEventListener('visibilitychange',function(){if(document.hidden)sync()});
setInterval(function(){if(!document.getElementById('p-band').hidden)gsel()},2000);
(async function(){
  try{
    const app=initializeApp(cfg),auth=getAuth(app);
    FS=getFirestore(app);
    const cr=await signInAnonymously(auth);ME=cr.user.uid;
  }catch(e){FS=null;ME=null;bmsg('Connexion à la bande impossible ('+(e&&e.code?e.code:'erreur')+'). Le jeu reste jouable en solo.');return}
  bmsg('Connecté. Choisis ton pseudo pour apparaître dans la bande.');
  onSnapshot(collection(FS,'players'),function(s){PL={};s.docs.forEach(function(x){PL[x.id]=x.data()});renderBand()},function(e){bmsg('Lecture impossible ('+(e&&e.code)+'). Vérifie les règles Firestore.')});
  onSnapshot(query(collection(FS,'gifts'),where('to','==',ME)),function(s){s.docs.forEach(gclaim)},function(){});
  sync();setInterval(sync,90000);
})();
</script>
</body>
</html>
